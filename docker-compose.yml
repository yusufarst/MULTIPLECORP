# The local development and CI stack (TASK-001; INFRASTRUCTURE §3): the application
# behind Nginx, with PostgreSQL and Valkey. Commands are in DEVELOPMENT.md. Images are
# pinned by digest; no port is published beyond the loopback interface.
name: multiplecorp

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: multiplecorp-app:local
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        volumes:
            - .:/var/www/html
            - dev-certs:/certs:ro
        environment:
            STACK_HTTPS_URL: https://web:8443
            STACK_HTTP_URL: http://web:8080
            STACK_CA_FILE: /certs/ca.crt
        depends_on:
            db-roles:
                condition: service_completed_successfully
            cache:
                condition: service_healthy
            certs:
                condition: service_completed_successfully

    web:
        image: nginx:1.30.6-alpine3.24@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
        ports:
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:8443:8443"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - dev-certs:/etc/nginx/certs:ro
        depends_on:
            app:
                condition: service_started
            certs:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/etc/nginx/certs/ca.crt", "https://localhost:8443/robots.txt"]
            interval: 2s
            timeout: 5s
            retries: 30

    db:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
            POSTGRES_USER: ${DB_SUPERUSER:?set DB_SUPERUSER in .env}
            POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?set DB_SUPERUSER_PASSWORD in .env}
        volumes:
            - db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 2s
            timeout: 5s
            retries: 30

    # The database roles of DATABASE §28 (TASK-005), created by the bootstrap superuser on every start.
    db-roles:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        volumes:
            - ./docker/postgres:/opt/postgres:ro
        environment:
            PGHOST: db
            PGDATABASE: ${DB_DATABASE}
            PGUSER: ${DB_SUPERUSER}
            PGPASSWORD: ${DB_SUPERUSER_PASSWORD}
            DB_DATABASE: ${DB_DATABASE}
            DB_SUPERUSER: ${DB_SUPERUSER}
            DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
            DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
            DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?set DB_MIGRATION_USERNAME in .env}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD in .env}
            DB_ADMIN_USERNAME: ${DB_ADMIN_USERNAME:?set DB_ADMIN_USERNAME in .env}
            DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?set DB_ADMIN_PASSWORD in .env}
        command: ["sh", "/opt/postgres/provision-roles.sh"]
        depends_on:
            db:
                condition: service_healthy

    cache:
        image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
        environment:
            VALKEYCLI_AUTH: ${REDIS_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "valkey-cli ping | grep -qx PONG"]
            interval: 2s
            timeout: 5s
            retries: 30

    # Creates the local TLS files once, into the dev-certs volume.
    certs:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: multiplecorp-app:local
        volumes:
            - ./docker/certs:/opt/certs:ro
            - dev-certs:/certs
        command: ["php", "/opt/certs/make-dev-certs.php", "/certs"]

    # Node.js for the frontend's lockfile install, typecheck and build: `docker compose run --rm node …`.
    node:
        image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
        profiles: ["tools"]
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            npm_config_cache: /tmp/npm-cache

    # Playwright with Chromium and WebKit for the browser suite (TASK-003): `docker compose run --rm e2e`.
    e2e:
        image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
        profiles: ["tools"]
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        working_dir: /var/www/html
        shm_size: 1gb
        volumes:
            - .:/var/www/html
        environment:
            HOME: /tmp
            E2E_BASE_URL: https://web:8443
            E2E_HTTP_URL: http://web:8080
        command: ["npx", "--no-install", "playwright", "test", "-c", "tests/Browser/playwright.config.ts"]

    # k6, the load tool of TEST_STRATEGY §17 (TASK-004): `docker compose run --rm k6 run tests/Performance/load/smoke.js`.
    k6:
        image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
        profiles: ["tools"]
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html:ro
        environment:
            K6_BASE_URL: https://web:8443

volumes:
    db-data:
    dev-certs:
