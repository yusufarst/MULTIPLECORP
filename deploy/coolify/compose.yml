# MULTIPLECORP's deployment definition for Coolify's Docker Compose deployment (TASK-072; INFRASTRUCTURE §2, §4; DIR-117,
# APPR-033): one Coolify resource per environment — staging and production — in MULTIPLECORP's own Coolify project, never
# sharing a network, a volume, a database, a cache or a secret with the second application (INF-07). Placeholder values
# only (PRQ-01): every setting comes from the resource's environment variables in Coolify, named in
# deploy/coolify/production.env.example, and the superuser, migration and administration logins from the operator's
# credentials directory. Deployed by hand from a verified `main` commit or release tag; Coolify's automatic deployment
# stays off (docs/09-operations/COOLIFY_DEPLOYMENT.md). The maintenance mode is the operator's runbook step before a
# deployment; the expand-only migrations and the catalogue sync are the one-shot `migrate` service, which every process of
# the release waits on (INFRASTRUCTURE §5).
#
# Networks as declared: `edge` for the proxy to reach `web` (the resource's "Connect to predefined network" stays off);
# `internal` holds the database and the cache, no published port, no proxy, no other application; `egress` gives the
# application processes their outbound HTTPS and nothing else. Limits: each service's CPU and memory come from the
# environment, their values from TASK-079's measurement.
#
# What Coolify v4.7.6 changes in this file when it deploys it, and how the definition holds against each change (TASK-078's
# staging findings; COOLIFY_DEPLOYMENT §3):
# - It gives every service every variable of the resource (`env_file: .env`). So the superuser, migration and
#   administration logins are no resource variables: they are files in the operator's credentials directory
#   (MULTIPLECORP_CREDENTIALS_DIR), mounted read-only into `db`, `db-roles` and `migrate` alone and read there by Docker's
#   `_FILE` convention, so no container's configuration holds them (INFRASTRUCTURE §4.4).
# - It attaches every service to every network of this file and to the resource's own network, which its proxy joins. So
#   PostgreSQL, Valkey and php-fpm listen only on their address on `internal` — `db.internal`, `cache.internal` and
#   `app.internal`, names no other network carries —, and the processes reach them by those names (H9-09).
# - It resolves a relative bind mount against its own resource directory. So the site template and the roles script are
#   built into their images, and nothing is mounted from the repository.
name: multiplecorp

x-app: &app
  build:
    context: ../..
    dockerfile: docker/php/Dockerfile.production
  # The environment in the tag, so staging's and production's builds on one host never share an image.
  image: multiplecorp-app:${APP_ENV:?set APP_ENV}-${MULTIPLECORP_RELEASE:?set MULTIPLECORP_RELEASE}
  restart: unless-stopped
  environment: &app-environment
    # The application's settings of .env.example in their production values (SX-03; WS-10).
    APP_NAME: MultipleCorp
    # `production` on production, `staging` on staging (SX-03; DIR-079 CB-04).
    APP_ENV: ${APP_ENV:?set APP_ENV}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?set APP_URL}
    APP_KEY: ${APP_KEY:?set APP_KEY}
    APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:?set APP_TRUSTED_PROXIES}
    APP_TRUSTED_HOSTS: ${APP_TRUSTED_HOSTS:?set APP_TRUSTED_HOSTS}
    # WS-08's report-only stage on staging (TASK-072): `true` there first, `false` on production.
    CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
    # The maintenance flag in the shared `storage` volume, read by every web process (H9-14).
    APP_MAINTENANCE_DRIVER: file
    LOG_CHANNEL: stack
    LOG_STACK: daily
    LOG_DAILY_DAYS: ${LOG_DAILY_DAYS:-14}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_DEPRECATIONS_CHANNEL: "null"
    SESSION_LIFETIME: "60"
    SESSION_ENCRYPT: "true"
    SESSION_EXPIRE_ON_CLOSE: "true"
    SESSION_COOKIE: __Host-multiplecorp_session
    SESSION_PATH: /
    SESSION_DOMAIN: "null"
    FILESYSTEM_DISK: local
    CACHE_STORE: redis
    REDIS_PORT: "6379"
    MAIL_MAILER: log
    DB_CONNECTION: pgsql
    # The database and the cache by their names on `internal`, the only addresses they listen on (H9-09).
    DB_HOST: db.internal
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    # The administration credential is in no running process: the operator gives it to `guards:maintain` alone, for its
    # run (INFRASTRUCTURE §4.4; EN-07; docs/09-operations/COOLIFY_DEPLOYMENT.md §6).
    REDIS_CLIENT: predis
    REDIS_HOST: cache.internal
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    SESSION_DRIVER: database
    QUEUE_CONNECTION: redis
    SECURITY_LOG_HMAC_KEY: ${SECURITY_LOG_HMAC_KEY:?set SECURITY_LOG_HMAC_KEY}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-10}
  volumes:
    - storage:/var/www/html/storage
  # `egress` lets the application reach the services it calls over HTTPS (Google sign-in, the alert channel); never the database.
  networks: [internal, egress]
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  # INFRASTRUCTURE §5 step 4, once per deployment and before any process of the release starts: expand-only migrations
  # through the migration/owner connection — its credentials in this service alone, never in a running process (§4.4;
  # H9-01) —, then the catalogue sync under the runtime role (DIR-094). A failure stops the deployment. The migration
  # login is read from its files for this run alone, never in the container's configuration, and the configuration the
  # entrypoint cached without it is cleared so the run reads it.
  migrate:
    <<: *app
    restart: "no"
    command:
      - sh
      - -c
      - >-
        DB_MIGRATION_USERNAME=$$(cat /run/multiplecorp/migration/username) &&
        DB_MIGRATION_PASSWORD=$$(cat /run/multiplecorp/migration/password) &&
        export DB_MIGRATION_USERNAME DB_MIGRATION_PASSWORD &&
        php artisan config:clear --no-interaction > /dev/null &&
        php artisan migrate --database=migration --force --no-interaction &&
        php artisan authorization:sync-catalogue --no-interaction
    volumes:
      - storage:/var/www/html/storage
      - type: bind
        source: ${MULTIPLECORP_CREDENTIALS_DIR}/migration
        target: /run/multiplecorp/migration
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db-roles:
        condition: service_completed_successfully
      cache:
        condition: service_healthy


  # The web processes: php-fpm, reached only by `web`, at its address on `internal` alone (H9-09).
  app:
    <<: *app
    environment:
      <<: *app-environment
      PHP_FPM_LISTEN: app.internal:9000
    networks:
      internal:
        aliases: [app.internal]
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "${APP_CPUS:-1.0}", memory: "${APP_MEMORY:-768M}" }

  # Two queue workers and the scheduler (INFRASTRUCTURE §4.1), restarted with every deployment (HO-23).
  worker-1:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--max-time=3600"]
    deploy:
      resources:
        limits: { cpus: "${WORKER_CPUS:-0.5}", memory: "${WORKER_MEMORY:-512M}" }
  worker-2:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=1", "--max-time=3600"]
    deploy:
      resources:
        limits: { cpus: "${WORKER_CPUS:-0.5}", memory: "${WORKER_MEMORY:-512M}" }
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    deploy:
      resources:
        limits: { cpus: "${SCHEDULER_CPUS:-0.25}", memory: "${SCHEDULER_MEMORY:-256M}" }

  # MULTIPLECORP's own Nginx: the site file built into its image (docker/nginx/Dockerfile.production;
  # deploy/nginx/multiplecorp.conf.template), behind Coolify's proxy, which terminates TLS.
  web:
    build:
      context: ../..
      dockerfile: docker/nginx/Dockerfile.production
    image: multiplecorp-web:${APP_ENV:?set APP_ENV}-${MULTIPLECORP_RELEASE:?set MULTIPLECORP_RELEASE}
    restart: unless-stopped
    volumes:
      - public:/var/www/html/public:ro
    environment:
      MULTIPLECORP_HSTS: ${MULTIPLECORP_HSTS:-max-age=300}
      # The application's own domain, one of APP_TRUSTED_HOSTS: the health check names it, as a browser does (WS-11).
      MULTIPLECORP_HOST: ${MULTIPLECORP_HOST:?set MULTIPLECORP_HOST}
      NGINX_ENVSUBST_FILTER: ^MULTIPLECORP_
    networks: [edge, internal]
    expose: ["8080"]
    depends_on:
      app:
        condition: service_healthy
      public:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Host: $${MULTIPLECORP_HOST}\" http://127.0.0.1:8080/kesehatan"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "${WEB_CPUS:-0.5}", memory: "${WEB_MEMORY:-128M}" }

  # The image's public folder, copied once per release for `web` to serve its static files.
  public:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "cp -a /var/www/html/public/. /srv/public/"]
    volumes:
      - public:/srv/public
    depends_on: {}

  # PostgreSQL on its address on `internal` alone (H9-09). Its superuser's name and password come from the operator's
  # credentials directory, read by the image's own `_FILE` convention.
  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=2048", "-c", "shared_preload_libraries=pg_stat_statements,auto_explain", "-c", "listen_addresses=db.internal"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE}
      POSTGRES_USER_FILE: /run/multiplecorp/superuser/username
      POSTGRES_PASSWORD_FILE: /run/multiplecorp/superuser/password
    volumes:
      - db-data:/var/lib/postgresql
      - type: bind
        source: ${MULTIPLECORP_CREDENTIALS_DIR}/superuser
        target: /run/multiplecorp/superuser
        read_only: true
        bind:
          create_host_path: false
    networks:
      internal:
        aliases: [db.internal]
    # Healthy once it answers where its clients connect, on `db.internal`: the image's first initialization runs a
    # server on the local socket alone, which a check through the socket would already count as up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h db.internal -U \"$$(cat /run/multiplecorp/superuser/username)\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "${DB_CPUS:-1.0}", memory: "${DB_MEMORY:-1536M}" }

  # The roles of DATABASE §28 (INFRASTRUCTURE §4.4), kept on every deployment by the same script as the local stack, built
  # into its image (docker/postgres/Dockerfile.roles). The superuser, migration and administration logins come from the
  # operator's credentials directory, read by the script's `_FILE` convention.
  db-roles:
    build:
      context: ../..
      dockerfile: docker/postgres/Dockerfile.roles
    image: multiplecorp-db-roles:${APP_ENV:?set APP_ENV}-${MULTIPLECORP_RELEASE:?set MULTIPLECORP_RELEASE}
    restart: "no"
    volumes:
      - type: bind
        source: ${MULTIPLECORP_CREDENTIALS_DIR}/superuser
        target: /run/multiplecorp/superuser
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MULTIPLECORP_CREDENTIALS_DIR}/migration
        target: /run/multiplecorp/migration
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MULTIPLECORP_CREDENTIALS_DIR}/admin
        target: /run/multiplecorp/admin
        read_only: true
        bind:
          create_host_path: false
    environment:
      PGHOST: db.internal
      PGDATABASE: ${DB_DATABASE}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # The directory the files above come from: the deployment stops at once when it is not set.
      MULTIPLECORP_CREDENTIALS_DIR: ${MULTIPLECORP_CREDENTIALS_DIR:?set MULTIPLECORP_CREDENTIALS_DIR}
      DB_SUPERUSER_FILE: /run/multiplecorp/superuser/username
      DB_SUPERUSER_PASSWORD_FILE: /run/multiplecorp/superuser/password
      DB_MIGRATION_USERNAME_FILE: /run/multiplecorp/migration/username
      DB_MIGRATION_PASSWORD_FILE: /run/multiplecorp/migration/password
      DB_ADMIN_USERNAME_FILE: /run/multiplecorp/admin/username
      DB_ADMIN_PASSWORD_FILE: /run/multiplecorp/admin/password
      # Production's roles: no CREATEDB for the migration login and no test extension (the local and CI stacks' only).
      DB_ROLES_FOR_TESTS: "no"
    command: ["sh", "/opt/postgres/provision-roles.sh"]
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  # Valkey on its address on `internal` and on loopback alone (H9-09), that address found from its name there when it
  # starts; the image's own init and entrypoint still start it, as its own user. With authentication, never evicting (H9-09;
  # SZ-09), its data kept across restarts so limiter and lock keys survive (HO-23).
  cache:
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    entrypoint: ["tini", "--", "sh", "-c", "address=$$(getent hosts cache.internal | cut -d ' ' -f 1 | head -n 1) && [ -n \"$$address\" ] && exec docker-entrypoint.sh valkey-server --bind \"$$address\" 127.0.0.1 \"$$@\"", "cache"]
    # A memory ceiling below the container's limit, so a full store refuses writes instead of being killed (SZ-09).
    command: ["--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--maxmemory", "${CACHE_MAXMEMORY:-192mb}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    environment:
      VALKEYCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - cache-data:/data
    networks:
      internal:
        aliases: [cache.internal]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "${CACHE_CPUS:-0.25}", memory: "${CACHE_MEMORY:-256M}" }

networks:
  edge: {}
  egress: {}
  internal:
    internal: true

volumes:
  storage: {}
  public: {}
  db-data: {}
  cache-data: {}
