# The CI of TEST_STRATEGY §17 (TASK-003, grown from TASK-001's minimal CI): once for every commit pushed to a branch,
# `main` included — a pull request's checks are its head's push run, never a second run for the pull request's own event,
# and a pull request merges only when its head contains `main`'s tip (DIR-118, APPR-034) —; a pushed tag runs the release
# gate, never a second CI run (TASK-073). On a fresh runner, the Docker Compose stack of DEVELOPMENT.md runs the verification command —
# the repository gates, TL-01–TL-08, TL-13 and TL-14 —, the browser suite of TL-09–TL-12 on Chromium and
# WebKit — each layer on a runner of its own, the required check its aggregator (DIR-103) —, TL-15 and TL-16, and the
# deployment definition's TL-05 (TASK-072); a failing check fails its job. No secret but the CI's own token, read-only,
# for Composer's downloads from GitHub; the one action, GitHub's own artifact upload, pinned to a commit
# (SECURITY SX-05; SECURITY_TEST_MATRIX SM-15). Each job keeps its verification summary for 90 days, the evidence the
# release integrity report of a later tag reads (RELEASE_PLAN §11; TASK-073); CI tests and reports, and never deploys (RL-01).
name: CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify — gates, TL-01–TL-08, TL-13, TL-14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEFORE_SHA: ${{ github.event.before }}
    steps:
      - name: Check out the tested commit with its recent history
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=100 origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"
          git log -1 --format='Tested commit: %H'

      - name: Tool versions
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          # A branch's every commit since it left `main`, as its pull request's range was (DIR-118); on `main`, the push's.
          base=''
          if [ "${GITHUB_REF_NAME}" != main ] && git fetch -q --no-tags --depth=100 origin main; then
            main_tip=$(git rev-parse FETCH_HEAD)
            base=$(git merge-base "${main_tip}" "${GITHUB_SHA}" 2>/dev/null || true)
            if [ "${base}" = "${main_tip}" ]; then
              echo "The tested commit contains main's tip ${main_tip}."
            else
              echo "::notice::The tested commit does not contain main's tip ${main_tip}: merge main into the branch, and let that push's run pass, before its pull request merges (DIR-118)."
            fi
          fi
          if [ -n "${base}" ]; then
            range="${base}..${GITHUB_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}~1..${GITHUB_SHA}"
          fi
          echo "VERIFY_COMMIT_RANGE=${range}" >> "$GITHUB_ENV"

      - name: Build the application image
        run: docker compose build app

      - name: Install the dependencies from the lockfiles
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer validate --strict
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer install --no-interaction --prefer-dist --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction
          docker compose run --rm node npm ci

      - name: The verification command
        run: sh scripts/verify.sh

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-evidence
          path: storage/logs/verify/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  browser-layer:
    name: Browser layer — ${{ matrix.layer }}
    runs-on: ubuntu-24.04
    # The E2E layer took 42 min with TASK-064's journeys (run 43414463682) and two pull-request runs were stopped at 45 min while
    # four layers shared the runners (runs 43414467272, 43415693072), then took 53.8 min while two runs shared them (run 43443557669):
    # the job's bound, not a test's, raised for the suite's size.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        layer: [e2e, localization, responsive, accessibility]
    steps:
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Tested commit: %H'

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build the application image and pull the Playwright image
        run: |
          docker compose build app
          docker compose --profile tools pull e2e

      - name: Install the dependencies from the lockfiles and build the frontend
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer install --no-interaction --prefer-dist --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction
          docker compose run --rm node npm ci
          docker compose run --rm node npm run build

      - name: The browser layer
        run: sh scripts/verify.sh browser-${{ matrix.layer }}

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.layer }}
          path: |
            storage/logs/verify/
            storage/test-results/browser/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # The required check, by the name BRANCH_PROTECTION's runbook gives it: FAIL unless every layer's job succeeded and its
  # evidence says PASS on this commit (DIR-103).
  browser:
    name: Browser — TL-09–TL-12 on Chromium and WebKit
    needs: browser-layer
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      LAYERS_RESULT: ${{ needs.browser-layer.result }}
    steps:
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Tested commit: %H'

      # A rerun keeps the earlier attempt's artifact of the same name: each layer's is the one its latest job uploaded (DIR-105).
      - name: Fetch each layer's summary from its latest job
        if: needs.browser-layer.result == 'success'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p evidence
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[]' > browser-artifacts.ndjson
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" --jq '.jobs[]' > browser-jobs.ndjson
          node scripts/ci/select-browser-evidence.mjs --artifacts browser-artifacts.ndjson --jobs browser-jobs.ndjson --run "${GITHUB_RUN_ID}" --head "${HEAD_SHA}" > browser-chosen.txt
          while read -r id name; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "evidence/${name}.zip"
            unzip -q "evidence/${name}.zip" '*summary*.txt' -d "evidence/${name}"
          done < browser-chosen.txt

      - name: Every layer passed on this commit
        run: node scripts/ci/check-browser-evidence.mjs --result "$LAYERS_RESULT" --commit "$GITHUB_SHA" --evidence evidence --out storage/logs/verify/summary-browser.txt

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: storage/logs/verify/
          retention-days: 90

  performance-and-migration:
    name: Performance and migration — TL-15, TL-16
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Tested commit: %H'

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build the application image
        run: docker compose build app

      - name: Install the PHP dependencies from the lockfile
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer install --no-interaction --prefer-dist --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction

      # The previous release's dependencies come from the lockfile through the same read-only token (TL-16; TASK-072).
      - name: The performance and migration layers
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: sh scripts/verify.sh performance migration

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      # The release integrity report reads every job's summary (RELEASE_PLAN §11; TASK-073).
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-evidence
          path: storage/logs/verify/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # TL-05 on the deployment definition (TASK-072; TASK-078's staging findings): deploy/coolify/compose.yml started as
  # Coolify v4.7.6 starts it — every service given every resource variable and attached to every network — with throwaway
  # values and credential files generated on the runner, and checked as Coolify's proxy reaches it: the stores and php-fpm
  # listening on the internal network alone, private and authenticated, no migration, superuser or administration
  # credential in any container's configuration or running process, nothing mounted from the repository, the headers, the
  # trusted host and proxy, the request log, the maintenance mode and Valkey's keys across restarts. It deploys nothing
  # anywhere (RL-01).
  deployment-definition:
    name: Deployment definition — TL-05 on the Coolify stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Tested commit: %H'

      - name: Prepare the environment
        run: |
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "DEPLOY_CHECK_PREBUILT=yes" >> "$GITHUB_ENV"

      - name: Build the production image
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: docker build --quiet --secret id=composer_auth,env=COMPOSER_AUTH -f docker/php/Dockerfile.production -t multiplecorp-app:production-deploy-check .

      - name: The deployment definition, started and checked
        run: sh scripts/verify.sh deployment

      - name: Stack logs
        if: failure()
        run: sh scripts/ci/check-deployment.sh logs

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-evidence
          path: storage/logs/verify/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: sh scripts/ci/check-deployment.sh down
