# The CI of TEST_STRATEGY §17 (TASK-003, grown from TASK-001's minimal CI): on every push to a branch and
# every pull request — a pushed tag runs the release gate, never a second CI run (TASK-073) —, on a fresh runner, the Docker Compose stack of DEVELOPMENT.md runs the verification command —
# the repository gates, TL-01–TL-08, TL-13 and TL-14 —, the browser suite of TL-09–TL-12 on Chromium and
# WebKit, and TL-15 and TL-16; a failing check fails its job. No secret but the CI's own token, read-only,
# for Composer's downloads from GitHub; the one action, GitHub's own artifact upload, pinned to a commit
# (SECURITY SX-05; SECURITY_TEST_MATRIX SM-15). Each job keeps its verification summary for 90 days, the evidence the
# release integrity report of a later tag reads (RELEASE_PLAN §11; TASK-073); CI tests and reports, and never deploys (RL-01).
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify — gates, TL-01–TL-08, TL-13, TL-14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEFORE_SHA: ${{ github.event.before }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the tested commit with its recent history
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=100 origin "${GITHUB_SHA}" ${BASE_SHA:+"$BASE_SHA"} ${HEAD_SHA:+"$HEAD_SHA"}
          git checkout -q --detach "${GITHUB_SHA}"
          git log -1 --format='Tested commit: %H'

      - name: Tool versions
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          if [ -n "${BASE_SHA}" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}~1..${GITHUB_SHA}"
          fi
          echo "VERIFY_COMMIT_RANGE=${range}" >> "$GITHUB_ENV"

      - name: Build the application image
        run: docker compose build app

      - name: Install the dependencies from the lockfiles
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer validate --strict
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer install --no-interaction --prefer-dist --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction
          docker compose run --rm node npm ci

      - name: The verification command
        run: sh scripts/verify.sh

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-evidence
          path: storage/logs/verify/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  browser:
    name: Browser — TL-09–TL-12 on Chromium and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Tested commit: %H'

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build the application image and pull the Playwright image
        run: |
          docker compose build app
          docker compose --profile tools pull e2e

      - name: Install the dependencies from the lockfiles and build the frontend
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer install --no-interaction --prefer-dist --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction
          docker compose run --rm node npm ci
          docker compose run --rm node npm run build

      - name: The browser suite
        run: sh scripts/verify.sh browser

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            storage/logs/verify/
            storage/test-results/browser/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  performance-and-migration:
    name: Performance and migration — TL-15, TL-16
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='Tested commit: %H'

      - name: Prepare the environment
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
          echo "VERIFY_ENVIRONMENT=CI ubuntu-24.04 run ${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Build the application image
        run: docker compose build app

      - name: Install the PHP dependencies from the lockfile
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm --no-deps -e COMPOSER_AUTH app composer install --no-interaction --prefer-dist --no-progress
          docker compose run --rm --no-deps app php artisan key:generate --no-interaction

      - name: The performance and migration layers
        run: sh scripts/verify.sh performance migration

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      # The release integrity report reads every job's summary (RELEASE_PLAN §11; TASK-073).
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-evidence
          path: storage/logs/verify/
          retention-days: 90

      - name: Stop the stack
        if: always()
        run: docker compose down -v
